<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Route Safety Monitor (V2)</title>
    <!-- Google Maps Extended Component Library -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.11/index.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    
    <style>
        :root { --bg: #ffffff; --border: #000000; --accent-red: #ff0000; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        .wrapper { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw; 
        }

        .sidebar {
            width: 100%;
            padding: 1.5rem;
            border-bottom: 2px solid var(--border);
            background: #fff;
            z-index: 1000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h1 { font-size: 1rem; font-weight: 900; text-transform: uppercase; margin: 0 0 1.5rem 0; line-height: 1; letter-spacing: 1px; }
        
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { flex: 1; }
        
        label { display: block; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; margin-bottom: 3px; color: #666; }
        
        input {
            width: 100%; border: none; border-bottom: 2px solid var(--border);
            padding: 8px 0; font-size: 1rem; outline: none; text-transform: capitalize;
            border-radius: 0;
        }

        button {
            width: 100%; background: var(--border); color: white; border: none; 
            padding: 14px; font-weight: 700; text-transform: uppercase; 
            cursor: pointer; font-size: 0.8rem;
        }

        /* Accident Total Display */
        .total-display {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: none; /* Hidden until search */
        }
        .total-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: #666; }
        .total-count { font-size: 2.5rem; font-weight: 900; color: var(--border); line-height: 1; }

        #map-container { flex-grow: 1; width: 100%; background: #f0f0f0; position: relative; }
        gmp-map { height: 100%; width: 100%; }

        /* Custom marker styling for AdvancedMarkerElement */
        .pin-marker {
            background: #000; color: #fff; width: 24px !important; height: 24px !important;
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 10px; border: 2px solid #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            position: absolute;
            transform-origin: 50% 100%;
        }
        .pin-marker span { transform: rotate(45deg); }

        @media (min-width: 768px) {
            .wrapper { flex-direction: row; }
            .sidebar { 
                width: 340px; 
                height: 100vh; 
                border-bottom: none; 
                border-right: 2px solid var(--border); 
                padding: 3rem 2rem;
            }
            .input-row { flex-direction: column; gap: 0; }
            h1 { font-size: 1.5rem; margin-bottom: 3rem; }
            .input-group { margin-bottom: 1.5rem; }
            .total-display { margin-top: auto; }
        }

        #status { font-size: 0.7rem; font-weight: 700; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="sidebar">
        <h1>Safety Analytics V2</h1>
        
        <div class="input-row" style="margin-bottom: 20px;">
            <div class="input-group">
                <label>Data Source (.xlsx)</label>
                <input type="file" id="dataFile" accept=".xlsx" style="font-size: 0.8rem; padding: 10px 0; border: none; border-bottom: 2px solid var(--border); width: 100%; box-sizing: border-box; font-family: inherit; cursor: pointer; background: transparent;">
            </div>
        </div>
        
        <div class="input-row">
            <div class="input-group">
                <label>Origin</label>
                <!-- Place Picker from map.html adapted to sidebar input -->
                <gmpx-place-picker id="fromPicker" placeholder="Samarkha"></gmpx-place-picker>
                <input type="hidden" id="from" value="Samarkha">
            </div>
            <div class="input-group">
                <label>Destination</label>
                <gmpx-place-picker id="toPicker" placeholder="Bhalej"></gmpx-place-picker>
                <input type="hidden" id="to" value="Bhalej">
            </div>
        </div>
        
        <button id="btn">Analyze Route</button>
        <div id="status">PROCESSING...</div>

        <div class="total-display" id="totalBox">
            <div class="total-label">Total Accidents on Route</div>
            <div class="total-count" id="accidentTotal">0</div>
        </div>
    </div>
    
    <div id="map-container">
        <!-- Replaced Leaflet map with Google Map (gmp-map) -->
        <!-- Note: We use DEMO_MAP_ID or a valid map ID for AdvancedMarkerElements -->
        <gmpx-api-loader key="AIzaSyDYIUpoMvq7bAyMoZjskqjmGddG1fXkUgc" solution-channel="GMP_GE_mapsandplacesautocomplete_v2"></gmpx-api-loader>
        <gmp-map map-id="DEMO_MAP_ID" center="22.5,72.8" zoom="8" id="googleMap"></gmp-map>
    </div>
</div>

<script>
    let innerMap;
    let AdvancedMarkerElement;
    
    async function initGoogleMaps() {
        await customElements.whenDefined('gmp-map');
        const gmpMap = document.getElementById('googleMap');
        innerMap = gmpMap.innerMap;
        
        // Wait for marker library
        const markerLib = await google.maps.importLibrary("marker");
        AdvancedMarkerElement = markerLib.AdvancedMarkerElement;
        
        // Handle Map UI controls
        innerMap.setOptions({
            mapTypeControl: false,
            streetViewControl: false
        });

        // Initialize Place Pickers to update hidden fields
        const fromPicker = document.getElementById('fromPicker');
        fromPicker.addEventListener('gmpx-placechange', () => {
            if(fromPicker.value && fromPicker.value.name) {
                document.getElementById('from').value = fromPicker.value.name;
                // If the user picked a place, we can also add its lat/lng to cityDB
                if(fromPicker.value.location) {
                    const loc = fromPicker.value.location;
                    const name = fromPicker.value.name.toLowerCase().trim();
                    cityDB[name] = [loc.lat(), loc.lng()];
                }
            }
        });

        const toPicker = document.getElementById('toPicker');
        toPicker.addEventListener('gmpx-placechange', () => {
            if(toPicker.value && toPicker.value.name) {
                document.getElementById('to').value = toPicker.value.name;
                // If the user picked a place, we can also add its lat/lng to cityDB
                if(toPicker.value.location) {
                    const loc = toPicker.value.location;
                    const name = toPicker.value.name.toLowerCase().trim();
                    cityDB[name] = [loc.lat(), loc.lng()];
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', initGoogleMaps);

    let cityDB = {};
    let accidentData = {};
    let dataLoaded = false;
    let mapLayers = []; // To store markers and polylines for clearing
    let routeSegments = [];

    // Clear existing map layers
    function clearMapLayers() {
        for(let layer of mapLayers) {
            layer.setMap(null);
        }
        mapLayers = [];
    }

    // Handle Uploading Excel Data
    document.getElementById('dataFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                cityDB = {};
                accidentData = {};
                routeSegments = [];
                
                jsonData.forEach(row => {
                    const fromCity = row['From']?.toString().toLowerCase().trim();
                    const toCity = row['To']?.toString().toLowerCase().trim();
                    
                    if (!fromCity || !toCity) return;

                    if (row['Fromlat'] && row['Fromlng']) {
                        cityDB[fromCity] = [parseFloat(row['Fromlat']), parseFloat(row['Fromlng'])];
                    }
                    if (row['Tolat'] && row['Tolng']) {
                        cityDB[toCity] = [parseFloat(row['Tolat']), parseFloat(row['Tolng'])];
                    }
                    
                    const accidents = parseInt(row['Total accdent (1 year)']) || 0;
                    accidentData[`${fromCity}-${toCity}`] = accidents;
                    accidentData[`${toCity}-${fromCity}`] = accidents;
                    
                    if(cityDB[fromCity] && cityDB[toCity]) {
                        routeSegments.push({
                            from: fromCity,
                            to: toCity,
                            startCoord: cityDB[fromCity], // [lat, lng]
                            endCoord: cityDB[toCity],     // [lat, lng]
                            accidents: accidents
                        });
                    }
                });

                dataLoaded = true;
                alert("Data loaded successfully! You can now type a route and click Analyze Route.");
                
                // Adjust map bounds to the loaded points (Google Maps implementation)
                if(innerMap) {
                    const bounds = new google.maps.LatLngBounds();
                    const lats = Object.values(cityDB).map(c => c[0]);
                    const lngs = Object.values(cityDB).map(c => c[1]);
                    
                    if (lats.length > 0 && lngs.length > 0) {
                        for(let value of Object.values(cityDB)) {
                            bounds.extend({ lat: value[0], lng: value[1] });
                        }
                        innerMap.fitBounds(bounds, { padding: { top: 50, right: 50, bottom: 50, left: 50 } });
                    }
                }

            } catch (err) {
                console.error(err);
                alert("Error parsing the Excel file. Make sure it matches the required format.");
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // Distribute pins evenly along a route
    function distributePins(coords, numPins) {
        if (numPins <= 0) return [];
        if (coords.length === 0) return [];
        if (numPins === 1) return [coords[Math.floor(coords.length / 2)]];
        
        const pins = [];
        const step = (coords.length - 2) / (numPins + 1); 
        
        for (let i = 1; i <= numPins; i++) {
            const index = Math.floor(step * i);
            if(index > 0 && index < coords.length) {
                pins.push(coords[index]);
            }
        }
        return pins;
    }

    // Make a custom HTML element for AdvancedMarkerElement
    function createCustomMarker(text) {
        const div = document.createElement('div');
        div.className = 'pin-marker';
        const span = document.createElement('span');
        span.innerText = text;
        div.appendChild(span);
        return div;
    }

    async function fetchAndDrawRoute(start, end, accidents, color = '#ff0000') {
        try {
            // start and end are [lat, lng]
            const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`);
            if(!response.ok) throw new Error("OSRM Network response was not ok");
            
            const data = await response.json();
            if(!data.routes || !data.routes[0]) throw new Error("Routes not found from OSRM");
            
            // OSRM provides [lng, lat], convert to {lat, lng} for Google Maps Polyline
            const coords = data.routes[0].geometry.coordinates.map(c => ({ lat: c[1], lng: c[0] }));

            // Draw polyline
            const poly = new google.maps.Polyline({
                path: coords,
                geodesic: true,
                strokeColor: color,
                strokeOpacity: 0.9,
                strokeWeight: 5
            });
            poly.setMap(innerMap);
            mapLayers.push(poly);

            // Add Start/End Markers
            const startMarker = new AdvancedMarkerElement({
                map: innerMap,
                position: { lat: start[0], lng: start[1] },
                content: createCustomMarker('S')
            });
            const endMarker = new AdvancedMarkerElement({
                map: innerMap,
                position: { lat: end[0], lng: end[1] },
                content: createCustomMarker('E')
            });
            mapLayers.push(startMarker, endMarker);

            // Distribute accident pins
            const pinCoords = distributePins(coords, accidents);
            
            pinCoords.forEach((p, idx) => {
                const accidentMarker = new AdvancedMarkerElement({
                    map: innerMap,
                    position: { lat: p.lat, lng: p.lng },
                    content: createCustomMarker(`${idx + 1}`)
                });
                
                // Add simple info window on click
                const infoWindow = new google.maps.InfoWindow({
                    content: `<b>Incident #${idx + 1}</b><br>Accident recorded on this segment.`
                });
                accidentMarker.addListener('click', () => {
                    infoWindow.open({
                        anchor: accidentMarker,
                        map: innerMap,
                    });
                });
                
                mapLayers.push(accidentMarker);
            });
            
            const routeBounds = new google.maps.LatLngBounds();
            coords.forEach(c => routeBounds.extend(c));
            return routeBounds;

        } catch(err) {
            console.error("Error drawing route segment:", err);
            return null;
        }
    }

    document.getElementById('btn').onclick = async () => {
        // Fallback or use picked values
        const fromInput = document.getElementById('fromPicker').value?.name || document.getElementById('from').value;
        const toInput = document.getElementById('toPicker').value?.name || document.getElementById('to').value;
        
        const from = fromInput.toLowerCase().trim();
        const to = toInput.toLowerCase().trim();
        
        if (!dataLoaded) {
            // Allow manual test if coordinates are in db or user typed it directly if they manually edited the HTML.
            // Actually, wait, the original logic checks dataLoaded. We'll enforce it.
            if(Object.keys(cityDB).length === 0) {
                alert("Please upload the data.xlsx file first! Or select valid locations if you modified the initial state.");
                return;
            }
        }

        if(!cityDB[from] || !cityDB[to]) {
            alert(`City not found in uploaded data. Please ensure it's loaded.`);
            return;
        }

        // Reset display state
        document.getElementById('status').style.display = 'block';
        document.getElementById('status').innerText = 'ANALYZING SPECIFIC ROUTE...';
        document.getElementById('totalBox').style.display = 'none';

        try {
            const start = cityDB[from];
            const end = cityDB[to];
            const routeKey = `${from}-${to}`;
            
            let totalAccidents = accidentData[routeKey];
            if (totalAccidents === undefined) {
                totalAccidents = "Route Not in Data";
            }
            document.getElementById('accidentTotal').innerText = totalAccidents;
            document.getElementById('totalBox').style.display = 'block';

            // Clear map layers
            clearMapLayers();
            
            let pinsToDraw = typeof totalAccidents === 'number' ? totalAccidents : 0;
            const bounds = await fetchAndDrawRoute(start, end, pinsToDraw, '#ff0000');
            
            if(bounds && innerMap) {
                innerMap.fitBounds(bounds, { padding: { top: 30, right: 30, bottom: 30, left: 30 } });
            }

            document.getElementById('status').style.display = 'none';

        } catch (err) {
            document.getElementById('status').style.display = 'none';
            alert("Error analyzing route.");
            console.error(err);
        }
    };
</script>
</body>
</html>
