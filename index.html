<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Route Safety Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #ffffff; --border: #000000; --accent-red: #ff0000; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        .wrapper { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            width: 100vw; 
        }

        .sidebar {
            width: 100%;
            padding: 1.5rem;
            border-bottom: 2px solid var(--border);
            background: #fff;
            z-index: 1000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h1 { font-size: 1rem; font-weight: 900; text-transform: uppercase; margin: 0 0 1.5rem 0; line-height: 1; letter-spacing: 1px; }
        
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { flex: 1; }
        
        label { display: block; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; margin-bottom: 3px; color: #666; }
        
        input {
            width: 100%; border: none; border-bottom: 2px solid var(--border);
            padding: 8px 0; font-size: 1rem; outline: none; text-transform: capitalize;
            border-radius: 0;
        }

        button {
            width: 100%; background: var(--border); color: white; border: none; 
            padding: 14px; font-weight: 700; text-transform: uppercase; 
            cursor: pointer; font-size: 0.8rem;
        }

        /* Accident Total Display */
        .total-display {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: none; /* Hidden until search */
        }
        .total-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: #666; }
        .total-count { font-size: 2.5rem; font-weight: 900; color: var(--border); line-height: 1; }

        #map { flex-grow: 1; width: 100%; background: #f0f0f0; }

        .pin-marker {
            background: #000; color: #fff; width: 24px !important; height: 24px !important;
            border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 10px; border: 2px solid #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        .pin-marker span { transform: rotate(45deg); }

        @media (min-width: 768px) {
            .wrapper { flex-direction: row; }
            .sidebar { 
                width: 340px; 
                height: 100vh; 
                border-bottom: none; 
                border-right: 2px solid var(--border); 
                padding: 3rem 2rem;
            }
            .input-row { flex-direction: column; gap: 0; }
            h1 { font-size: 1.5rem; margin-bottom: 3rem; }
            .input-group { margin-bottom: 1.5rem; }
            .total-display { margin-top: auto; }
        }

        #status { font-size: 0.7rem; font-weight: 700; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="sidebar">
        <h1>Safety Analytics</h1>
        
        <div class="input-row" style="margin-bottom: 20px;">
            <div class="input-group">
                <label>Data Source (.xlsx)</label>
                <input type="file" id="dataFile" accept=".xlsx" style="font-size: 0.8rem; padding: 10px 0; border: none; border-bottom: 2px solid var(--border); width: 100%; box-sizing: border-box; font-family: inherit; cursor: pointer; background: transparent;">
            </div>
        </div>
        
        <div class="input-row">
            <div class="input-group">
                <label>Origin</label>
                <input type="text" id="from" placeholder="Samarkha" value="Samarkha">
            </div>
            <div class="input-group">
                <label>Destination</label>
                <input type="text" id="to" placeholder="Bhalej" value="Bhalej">
            </div>
        </div>
        
        <button id="btn">Analyze Route</button>
        <div id="status">PROCESSING...</div>

        <div class="total-display" id="totalBox">
            <div class="total-label">Total Accidents on Route</div>
            <div class="total-count" id="accidentTotal">0</div>
        </div>
    </div>
    
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<script>
    const map = L.map('map', { zoomControl: false }).setView([22.5, 72.8], 8);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let cityDB = {};
    let accidentData = {};
    let dataLoaded = false;

    // Handle Uploading Excel Data
    document.getElementById('dataFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                cityDB = {};
                accidentData = {};
                
                jsonData.forEach(row => {
                    const fromCity = row['From']?.toString().toLowerCase().trim();
                    const toCity = row['To']?.toString().toLowerCase().trim();
                    
                    if (!fromCity || !toCity) return;

                    if (row['Fromlat'] && row['Fromlng']) {
                        cityDB[fromCity] = [parseFloat(row['Fromlat']), parseFloat(row['Fromlng'])];
                    }
                    if (row['Tolat'] && row['Tolng']) {
                        cityDB[toCity] = [parseFloat(row['Tolat']), parseFloat(row['Tolng'])];
                    }
                    
                    const accidents = parseInt(row['Total accdent (1 year)']) || 0;
                    accidentData[`${fromCity}-${toCity}`] = accidents;
                    accidentData[`${toCity}-${fromCity}`] = accidents;
                    // Store route segments info
                    routeSegments.push({
                        from: fromCity,
                        to: toCity,
                        startCoord: cityDB[fromCity],
                        endCoord: cityDB[toCity],
                        accidents: accidents
                    });
                });

                dataLoaded = true;
                alert("Data loaded successfully! You can now type a route and click Analyze Route.");
                
                // Adjust map to the loaded points
                const lats = Object.values(cityDB).map(c => c[0]);
                const lngs = Object.values(cityDB).map(c => c[1]);
                if (lats.length > 0 && lngs.length > 0) {
                    map.fitBounds([
                        [Math.min(...lats), Math.min(...lngs)],
                        [Math.max(...lats), Math.max(...lngs)]
                    ], { padding: [50, 50] });
                }

            } catch (err) {
                console.error(err);
                alert("Error parsing the Excel file. Make sure it matches the required format.");
            }
        };
        reader.readAsArrayBuffer(file);
    });

    let mapLayers = [];
    let routeSegments = [];
    
    // Distribute pins evenly along a route
    function distributePins(coords, numPins) {
        if (numPins <= 0) return [];
        if (coords.length === 0) return [];
        if (numPins === 1) return [coords[Math.floor(coords.length / 2)]];
        
        const pins = [];
        // Avoid placing exactly on the very first or very last coordinate (the cities themselves)
        const step = (coords.length - 2) / (numPins + 1); 
        
        for (let i = 1; i <= numPins; i++) {
            const index = Math.floor(step * i);
            if(index > 0 && index < coords.length) {
                pins.push(coords[index]);
            }
        }
        return pins;
    }

    async function fetchAndDrawRoute(start, end, accidents, color = '#ff0000') {
        try {
            // OSRM requires [lng, lat]
            const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`);
            if(!response.ok) throw new Error("OSRM Network response was not ok");
            
            const data = await response.json();
            if(!data.routes || !data.routes[0]) throw new Error("Routes not found from OSRM");
            
            // Leaflet requires [lat, lng]
            const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);

            const poly = L.polyline(coords, { color: color, weight: 5, opacity: 0.9 }).addTo(map);
            mapLayers.push(poly);

            const icons = {
                start: L.divIcon({ className: 'pin-marker', html: '<span>S</span>', iconAnchor: [12, 24] }),
                end: L.divIcon({ className: 'pin-marker', html: '<span>E</span>', iconAnchor: [12, 24] })
            };
            
            mapLayers.push(L.marker(start, { icon: icons.start }).addTo(map));
            mapLayers.push(L.marker(end, { icon: icons.end }).addTo(map));

            const pinCoords = distributePins(coords, accidents);
            pinCoords.forEach((p, idx) => {
                const accIcon = L.divIcon({ className: 'pin-marker', html: `<span>${idx + 1}</span>`, iconAnchor: [12, 24], bgPos: [-12, -24] });
                const m = L.marker(p, { icon: accIcon }).addTo(map);
                m.bindPopup(`<b>Incident #${idx + 1}</b><br>Accident recorded on this segment.`);
                mapLayers.push(m);
            });
            
            return poly.getBounds();
        } catch(err) {
            console.error("Error drawing route segment:", err);
            return null;
        }
    }

    async function renderAllRoutes() {
        document.getElementById('status').style.display = 'block';
        document.getElementById('status').innerText = 'DRAWING ALL ROUTES...';
        
        mapLayers.forEach(l => map.removeLayer(l));
        mapLayers = [];

        // Colors for different segments
        const colors = ['#ff0000', '#0000ff', '#ff8c00', '#800080', '#008000', '#e74c3c', '#9b59b6'];

        for (let i = 0; i < routeSegments.length; i++) {
            const seg = routeSegments[i];
            const color = colors[i % colors.length];
            // Render route to map, adding delay to avoid rate limiting OSRM demo server
            await fetchAndDrawRoute(seg.startCoord, seg.endCoord, seg.accidents, color);
            await new Promise(r => setTimeout(r, 400)); 
        }

        document.getElementById('status').style.display = 'none';
    }

    document.getElementById('btn').onclick = async () => {
        if (!dataLoaded) {
            alert("Please upload the data.xlsx file first!");
            return;
        }

        const from = document.getElementById('from').value.toLowerCase().trim();
        const to = document.getElementById('to').value.toLowerCase().trim();
        
        if(!cityDB[from] || !cityDB[to]) {
            alert(`City not found in uploaded data. Available cities: ${Object.keys(cityDB).map(c => c.charAt(0).toUpperCase() + c.slice(1)).join(', ')}`);
            return;
        }

        // Reset display state
        document.getElementById('status').style.display = 'block';
        document.getElementById('status').innerText = 'ANALYZING SPECIFIC ROUTE...';
        document.getElementById('totalBox').style.display = 'none';

        try {
            const start = cityDB[from];
            const end = cityDB[to];
            const routeKey = `${from}-${to}`;
            
            let totalAccidents = accidentData[routeKey];
            if (totalAccidents === undefined) {
                totalAccidents = "Route Not in Data";
            }
            document.getElementById('accidentTotal').innerText = totalAccidents;
            document.getElementById('totalBox').style.display = 'block';

            // Visually highlight this specifically routed segment if direct
            mapLayers.forEach(l => map.removeLayer(l));
            mapLayers = [];
            
            // Only draw it and distribute pins if we have a valid int for accidents on the route in Excel
            let pinsToDraw = typeof totalAccidents === 'number' ? totalAccidents : 0;
            const bounds = await fetchAndDrawRoute(start, end, pinsToDraw, '#ff0000');
            if(bounds) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }

            document.getElementById('status').style.display = 'none';

        } catch (err) {
            document.getElementById('status').style.display = 'none';
            alert("Error analyzing route.");
            console.error(err);
        }
    };
</script>
</body>
</html>
